<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5a0625">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Not Bilbanan controller</title>
<style>
/* The phone: one huge hold-to-drive button in your car's colour. Same join flow as Finger Frolic's pad.html. */
:root{--table:#5a0625;--band:#8f0b3c;--board:#ffd81f;--ink:#ffe98a;--ink-dim:#e7b9c6;--font:Verdana,Geneva,Tahoma,sans-serif;
  --c:#ffd81f;--cd:#7a5c00;--cl:#fff1a0;color-scheme:light}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;margin:0;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:var(--table);color:var(--ink);font:16px/1.35 var(--font);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box}
[hidden]{display:none!important}
h1{margin:0;font:bold italic 30px/1.15 var(--font);color:var(--board);text-align:center}
.form{margin:auto 0;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.form input{font:bold 24px var(--font);padding:14px;border:0;border-radius:8px;background:#3d0418;color:var(--ink);text-align:center;
  touch-action:manipulation;user-select:text;-webkit-user-select:text;box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.form input::placeholder{color:#a5677c}
.form input.code{letter-spacing:.25em;text-transform:uppercase}
.btn{font:bold italic 22px var(--font);color:#5a0625;background:var(--board);border:0;border-radius:8px;min-height:64px;padding:0 18px;
  box-shadow:0 4px 0 #b88f00;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88f00}
.note{color:var(--ink-dim);font-size:14px;margin:0}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

#pad{display:flex;flex-direction:column;flex:1;min-height:0;gap:10px}
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.me{flex:1;display:flex;align-items:center;gap:8px;font:bold italic 22px var(--font);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me i{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--cd);flex:none}
.lamps{display:flex;gap:6px;padding:6px 8px;background:#4b4a4d;border-radius:6px}
.lamps i{width:18px;height:18px;border-radius:50%;background:#7a1424;box-shadow:0 0 0 2px #e8e8e8}
.lamps i.red{background:#ff2b2b;box-shadow:0 0 0 2px #e8e8e8,0 0 10px #ff3c3c}
.lamps i.green{background:#30d94e;box-shadow:0 0 0 2px #e8e8e8,0 0 10px #50ff6e}
.info{min-height:24px;text-align:center;color:var(--ink-dim);font-size:15px}
.info b{color:var(--ink)}
.meter{height:12px;border-radius:6px;background:#3d0418;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:#30d94e;transition:width .15s}
.zone{flex:1;min-height:0;border-radius:22px;background:var(--cd);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;text-align:center;padding:16px;box-shadow:inset 0 0 0 6px var(--c),0 8px 0 #2e0212;transition:background .08s,transform .08s;touch-action:none}
.zone .big{font:bold italic clamp(34px,11vw,64px)/1.05 var(--font);color:var(--ink)}
.zone .sub{font:italic 17px var(--font);color:var(--ink-dim);max-width:300px}
.zone.on{background:var(--cl);transform:translateY(5px);box-shadow:inset 0 0 0 6px var(--c),0 3px 0 #2e0212}
.zone.on .big,.zone.on .sub{color:var(--cd)}
.zone.off{opacity:.45}
.zone.crash{animation:ouch .45s}
@keyframes ouch{0%{transform:translateX(-12px)}30%{transform:translateX(10px)}60%{transform:translateX(-6px)}100%{transform:none}}
.act{width:100%}
</style>
</head>
<body>
<div id="join" class="form">
  <h1>Not Bilbanan</h1>
  <input id="name" maxlength="12" placeholder="Your name" autocomplete="nickname" enterkeyhint="go">
  <input id="room" class="code" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters">
  <button id="go" class="btn">Join the race</button>
  <p class="note">The code is under the track on the big screen.</p>
</div>
<div id="pad" hidden>
  <div class="top"><span class="me" id="me"></span><span class="lamps" id="lamps"><i></i><i></i><i></i><i></i></span></div>
  <div class="info" id="info"></div>
  <div class="meter" id="meter" hidden><i id="fill"></i></div>
  <div class="zone" id="zone"><div class="big" id="big"></div><div class="sub" id="sub"></div></div>
  <button id="act" class="btn act" hidden></button>
</div>
<script type="module">
import { joinRoom, param, load, save } from './shared/net.js';

const $ = id => document.getElementById(id);
const buzz = p => { try { navigator.vibrate?.(p); } catch (e) {} };
const CAR = {
  red:    {body:'#e3161b', dark:'#7d0a0c', light:'#ff5a4a', name:'Red'},
  orange: {body:'#ff9a12', dark:'#9a5200', light:'#ffc25a', name:'Orange'},
  blue:   {body:'#1f6fe0', dark:'#0b2f6e', light:'#7ab0ff', name:'Blue'},
  green:  {body:'#22b04a', dark:'#0b5a20', light:'#86e69a', name:'Green'},
};   // the same colours as CARS in index.html
const ORD = ['', '1st', '2nd', '3rd', '4th'];

$('name').value = param('name') || load('frolic-name', '');   // shared with Finger Frolic on purpose: same phones, same people
$('room').value = (param('room') || '').toUpperCase();
if (param('room')) $('room').hidden = true;

let net = null, seat = null, status = 'connecting', S = null, prev = null, myName = '';

function start() {
  const name = $('name').value.trim().slice(0, 12), code = $('room').value.trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{5}$/.test(code)) {
    $('room').hidden = false; $('room').focus(); $('room').classList.add('shake'); setTimeout(() => $('room').classList.remove('shake'), 300); return;
  }
  save('frolic-name', name); myName = name;
  $('join').hidden = true; $('pad').hidden = false;
  net = joinRoom({
    room: code, name,
    onSeat: s => { seat = s; paint(); render(); },
    onMessage: m => { if (m && m.t === 's') { prev = S; S = m; feel(); render(); } },
    onStatus: s => { status = s; render(); },
  });
  render();
}
$('go').onclick = start;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

function paint() {
  const c = CAR[seat]; if (!c) return;
  const r = document.documentElement.style;
  r.setProperty('--c', c.body); r.setProperty('--cd', c.dark); r.setProperty('--cl', c.light);
}

// ---------- the throttle: held while any finger is on the button ----------
const fingers = new Set();
let beat = null;
const send = () => { if (net) net.act({ on: fingers.size > 0 }); };
function changed() {
  clearInterval(beat);
  if (fingers.size) beat = setInterval(send, 400);   // the TV lets go of a phone it has not heard from in 1.5 s
  send(); render();
}
const zone = $('zone');
zone.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { zone.setPointerCapture(e.pointerId); } catch (x) {}
  if (!fingers.size) buzz(8);
  fingers.add(e.pointerId); changed();
});
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture'])
  zone.addEventListener(ev, e => { if (fingers.delete(e.pointerId)) changed(); });
zone.addEventListener('contextmenu', e => e.preventDefault());
zone.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible' && fingers.size) { fingers.clear(); changed(); } });
addEventListener('blur', () => { if (fingers.size) { fingers.clear(); changed(); } });

$('act').onclick = () => { if (net) { net.act({ go: 1 }); buzz(15); } };

// ---------- what the phone shows ----------
const mine = () => (S && seat && S.p[seat]) || null;
function render() {
  const me = mine(), c = CAR[seat], on = fingers.size > 0;
  $('me').innerHTML = '';
  const dot = document.createElement('i'), nm = document.createElement('span');
  nm.textContent = (myName || (c ? c.name : 'Driver')) + (c && myName ? ' · ' + c.name : '');
  $('me').append(dot, nm);
  [...$('lamps').children].forEach((el, k) => { el.className = S && S.lamps[k] !== 'off' ? S.lamps[k] : ''; });
  let big = '', sub = '', info = '', act = '', dim = false, meter = null;
  if (status === 'full') { big = 'FULL'; sub = 'Four cars is the most. Try again after this race.'; dim = true; }
  else if (status !== 'open' || !seat || !S) { big = '…'; sub = status === 'waiting' ? 'Looking for the big screen…' : 'Connecting…'; dim = true; }
  else if (S.st === 'build') {
    big = 'HOLD = GO'; sub = 'Hold to speed up, let go to brake. Too fast in a bend and you fly off!';
    info = S.track ? 'The track is ready.' : 'Someone is <b>building the track</b> on the big screen…';
    if (S.track) act = 'Start the race';
  } else if (S.st === 'lobby') {
    big = me.in ? 'YOU’RE IN!' : 'HOLD TO JOIN'; sub = me.in ? 'Keep holding…' : 'Hold the button to get on the grid';
    info = 'The race starts when nobody joins or lets go for a moment.'; meter = S.lock;
  } else if (!me.in) { big = 'NEXT RACE'; sub = 'You’re not in this one. Watch the big screen!'; dim = true; if (S.st === 'done') act = 'Race again'; }
  else if (S.st === 'countdown') { big = 'READY…'; sub = 'Go on green!'; }
  else if (S.st === 'race') {
    big = 'LAP ' + me.lap + '/' + S.laps; sub = me.crash ? 'Off the track!' : me.t.toFixed(2) + ' s';
  } else if (S.st === 'done') {
    big = ORD[me.place] || '–'; sub = S.win + (me.best != null ? ' · best lap ' + me.best.toFixed(2) : '');
    act = 'Race again';
  }
  $('big').textContent = big; $('sub').textContent = sub; $('info').innerHTML = info;
  $('meter').hidden = meter == null; if (meter != null) $('fill').style.width = (meter * 100) + '%';
  $('act').hidden = !act; $('act').textContent = act;
  zone.classList.toggle('on', on); zone.classList.toggle('off', dim && !on);
}

// buzz for what happened on the big screen
function feel() {
  const a = prev && seat && prev.p[seat], b = mine();
  if (!prev || !b) return;
  prev.lamps.forEach((l, k) => { if (S.lamps[k] === 'red' && l !== 'red') buzz(15); });
  if (prev.st === 'countdown' && S.st === 'race' && b.in) buzz(80);
  if (b.crash && !a.crash) { buzz([120, 40, 60]); zone.classList.remove('crash'); void zone.offsetWidth; zone.classList.add('crash'); }
  if (S.st === 'race' && b.lap > a.lap) buzz(20);
  if (S.st === 'done' && prev.st !== 'done' && b.in) buzz(b.place === 1 ? [40, 40, 40, 40, 220] : 60);
  if (S.st === 'lobby' && b.in && !a.in) buzz(25);
}
render();
if (param('auto') != null) start();   // dev.html
</script>
</body>
</html>
